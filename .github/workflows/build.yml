# Builds the APK via GitHub Actions (supports push to main, manual trigger via "Run workflow", and automatic release on v* tags).
# The recompiler uses ci/default.xbe.enc decrypted with XBE_KEY (defaults to BlackUSA2026RecompKey if secret is not set).
# Includes C/C++ compiler caching (ccache) so subsequent builds after editing C++/Java take ~3-5 minutes instead of ~60 minutes.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nama versi APK (contoh: 1.7.0-rafli6373)"
        required: false
        default: "1.7.0-rafli6373"
        type: string
      create_release:
        description: "Publikasikan juga ke halaman GitHub Releases?"
        required: false
        default: false
        type: boolean
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6
      CCACHE_MAXSIZE: 4G

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Restore C++ & Recompiler Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ccache
            out/build/ccache-bin
            out/build/android-tools
            third_party/SDL
          key: black-android-cache-${{ hashFiles('config/game.toml', 'CMakeLists.txt', 'app/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            black-android-cache-${{ hashFiles('config/game.toml', 'CMakeLists.txt', 'app/build.gradle') }}-
            black-android-cache-

      - name: Setup ccache for fast C++ rebuilds
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $binDir = Join-Path $PWD "out\build\ccache-bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $cachedExe = Join-Path $binDir "ccache.exe"
          $ccacheExe = $null

          if (Test-Path $cachedExe) {
            Write-Host "Using cached ccache binary: $cachedExe"
            $ccacheExe = $cachedExe
          } elseif ($existing = Get-Command ccache -ErrorAction SilentlyContinue) {
            $ccacheExe = $existing.Source
          } else {
            $dlDir = Join-Path $env:RUNNER_TEMP "ccache-dl"
            New-Item -ItemType Directory -Force -Path $dlDir | Out-Null
            $zipPath = Join-Path $dlDir "ccache.zip"

            # 1) Authenticated GitHub CLI release download (avoids unauthenticated 504/rate-limit)
            gh release download --repo ccache/ccache --pattern "ccache-*-windows-x86_64.zip" --dir $dlDir --clobber 2>$null
            $ghZip = Get-ChildItem -Path $dlDir -Filter "ccache-*-windows-x86_64.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($ghZip) { Copy-Item $ghZip.FullName $zipPath -Force }
            if (-not (Test-Path $zipPath) -or (Get-Item $zipPath).Length -lt 100000) {
              # 2) Direct curl with exponential retries across multiple stable versions
              $urls = @(
                "https://github.com/ccache/ccache/releases/download/v4.11.2/ccache-4.11.2-windows-x86_64.zip",
                "https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip",
                "https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip"
              )
              foreach ($u in $urls) {
                Write-Host "Downloading ccache from $u ..."
                curl.exe --fail --location --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors $u -o $zipPath
                if ($LASTEXITCODE -eq 0 -and (Test-Path $zipPath) -and (Get-Item $zipPath).Length -gt 100000) {
                  break
                }
              }
            }

            if ((Test-Path $zipPath) -and (Get-Item $zipPath).Length -gt 100000) {
              $extDir = Join-Path $dlDir "extracted"
              Expand-Archive -Path $zipPath -DestinationPath $extDir -Force
              $found = Get-ChildItem -Path $extDir -Filter "ccache.exe" -Recurse | Select-Object -First 1
              if ($found) {
                Copy-Item $found.FullName $cachedExe -Force
                $ccacheExe = $cachedExe
              }
            }

            # 3) Last-resort Chocolatey fallback (non-fatal if 504 occurs)
            if (-not $ccacheExe) {
              choco install ccache -y --no-progress
              if ($cmd = Get-Command ccache -ErrorAction SilentlyContinue) {
                Copy-Item $cmd.Source $cachedExe -Force -ErrorAction SilentlyContinue
                $ccacheExe = $cmd.Source
              }
            }
          }

          if ($ccacheExe -and (Test-Path $ccacheExe)) {
            $ccacheDir = Join-Path $env:RUNNER_TEMP "ccache"
            New-Item -ItemType Directory -Force -Path $ccacheDir | Out-Null
            Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $ccacheExe -Parent)
            Add-Content -Path $env:GITHUB_ENV -Value "CCACHE_BIN=$ccacheExe"
            Add-Content -Path $env:GITHUB_ENV -Value "CCACHE_DIR=$ccacheDir"
            & $ccacheExe --version
          } else {
            Write-Host "::warning::ccache download unavailable (upstream 504/timeout); continuing APK build without ccache."
          }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Android SDK packages
        shell: cmd
        run: call "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" --install "platforms;android-34" "ndk;%NDK_VERSION%" "ndk;28.2.13676358" "cmake;%CMAKE_VERSION%" >nul

      - name: Decrypt default.xbe
        shell: bash
        env:
          XBE_KEY: ${{ secrets.XBE_KEY }}
        run: |
          EFFECTIVE_KEY="${XBE_KEY:-BlackUSA2026RecompKey}"
          mkdir -p assets
          key="$RUNNER_TEMP/xbe.key"
          printf '%s' "$EFFECTIVE_KEY" > "$key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ci/default.xbe.enc -out assets/default.xbe -pass "file:$key"
          rm -f "$key"
          sha1sum assets/default.xbe

      - name: Release key (Optional)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::notice::No release keystore provided: signing APK with debug key (ready to install)."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "BLACK_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "BLACK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BLACK_KEY_ALIAS=$KEY_ALIAS"
            echo "BLACK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="${{ inputs.version_name || '1.7.0-rafli6373' }}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "GRADLE_ARGS=-PversionCode=${{ github.run_number }} -PversionName=$name" >> "$GITHUB_ENV"

      - name: Build APK
        shell: cmd
        run: call build.bat

      - name: ccache Statistics
        shell: pwsh
        run: |
          if ($env:CCACHE_BIN -and (Test-Path $env:CCACHE_BIN)) {
            & $env:CCACHE_BIN -s
          } else {
            Write-Host "ccache was not active for this run."
          }

      - name: Name the APK
        shell: bash
        run: mv app/build/outputs/apk/release/app-release.apk "Black-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Black-${{ steps.version.outputs.name }}
          path: Black-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Prepare Release Notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        shell: bash
        run: |
          apk="Black-${{ steps.version.outputs.name }}.apk"
          tag_name="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            tag_name="v${{ steps.version.outputs.name }}"
          fi
          size=$(awk -v b="$(stat -c %s "$apk")" 'BEGIN { printf "%.1f MB", b / 1048576 }')
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          sed -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" -e "s|{{VERSION}}|$tag_name|g" -e "s|{{TAG}}|$tag_name|g" \
              -e "s|{{APK}}|$apk|g" -e "s|{{SIZE}}|$size|g" -e "s|{{SHA256}}|$sha|g" ci/release-notes.md > "$RUNNER_TEMP/release-notes.md"
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo
            echo "## What's Changed"
            echo
            git log --no-merges --pretty='* %s' ${prev:+"$prev.."}"HEAD"
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: Black for Android ${{ steps.version.outputs.name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: Black-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          make_latest: true
