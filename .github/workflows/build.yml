# Builds the APK via GitHub Actions (supports push to main, manual trigger via "Run workflow", and automatic release on v* tags).
# The recompiler uses ci/default.xbe.enc decrypted with XBE_KEY (defaults to BlackUSA2026RecompKey if secret is not set).
# Includes C/C++ compiler caching (ccache) so subsequent builds after editing C++/Java take ~3-5 minutes instead of ~60 minutes.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nama versi APK (contoh: 1.7.0-rafli6373)"
        required: false
        default: "1.7.0-rafli6373"
        type: string
      create_release:
        description: "Publikasikan juga ke halaman GitHub Releases?"
        required: false
        default: false
        type: boolean
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6
      CCACHE_MAXSIZE: 4G

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup ccache for fast C++ rebuilds
        shell: pwsh
        run: |
          choco install ccache -y --no-progress
          $ccachePath = (Get-Command ccache).Source
          $ccacheDir = Join-Path $env:RUNNER_TEMP "ccache"
          Write-Output "CCACHE_BIN=$ccachePath" >> $env:GITHUB_ENV
          Write-Output "CCACHE_DIR=$ccacheDir" >> $env:GITHUB_ENV

      - name: Restore C++ & Recompiler Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ccache
            out/build/android-tools
            third_party/SDL
          key: black-android-cache-${{ hashFiles('config/game.toml', 'CMakeLists.txt', 'app/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            black-android-cache-${{ hashFiles('config/game.toml', 'CMakeLists.txt', 'app/build.gradle') }}-
            black-android-cache-

      - name: Android SDK packages
        shell: cmd
        run: call "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" --install "platforms;android-34" "ndk;%NDK_VERSION%" "ndk;28.2.13676358" "cmake;%CMAKE_VERSION%" >nul

      - name: Decrypt default.xbe
        shell: bash
        env:
          XBE_KEY: ${{ secrets.XBE_KEY }}
        run: |
          EFFECTIVE_KEY="${XBE_KEY:-BlackUSA2026RecompKey}"
          mkdir -p assets
          key="$RUNNER_TEMP/xbe.key"
          printf '%s' "$EFFECTIVE_KEY" > "$key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ci/default.xbe.enc -out assets/default.xbe -pass "file:$key"
          rm -f "$key"
          sha1sum assets/default.xbe

      - name: Release key (Optional)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::notice::No release keystore provided: signing APK with debug key (ready to install)."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "BLACK_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "BLACK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BLACK_KEY_ALIAS=$KEY_ALIAS"
            echo "BLACK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="${{ inputs.version_name || '1.7.0-rafli6373' }}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "GRADLE_ARGS=-PversionCode=${{ github.run_number }} -PversionName=$name" >> "$GITHUB_ENV"

      - name: Build APK
        shell: cmd
        run: call build.bat

      - name: ccache Statistics
        shell: pwsh
        run: ccache -s

      - name: Name the APK
        shell: bash
        run: mv app/build/outputs/apk/release/app-release.apk "Black-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Black-${{ steps.version.outputs.name }}
          path: Black-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Prepare Release Notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        shell: bash
        run: |
          apk="Black-${{ steps.version.outputs.name }}.apk"
          tag_name="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            tag_name="v${{ steps.version.outputs.name }}"
          fi
          size=$(awk -v b="$(stat -c %s "$apk")" 'BEGIN { printf "%.1f MB", b / 1048576 }')
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          sed -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" -e "s|{{VERSION}}|$tag_name|g" -e "s|{{TAG}}|$tag_name|g" \
              -e "s|{{APK}}|$apk|g" -e "s|{{SIZE}}|$size|g" -e "s|{{SHA256}}|$sha|g" ci/release-notes.md > "$RUNNER_TEMP/release-notes.md"
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo
            echo "## What's Changed"
            echo
            git log --no-merges --pretty='* %s' ${prev:+"$prev.."}"HEAD"
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: Black for Android ${{ steps.version.outputs.name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: Black-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          make_latest: true
